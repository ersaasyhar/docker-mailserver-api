services:
  dms:
    image: ghcr.io/docker-mailserver/docker-mailserver:16.0.1
    container_name: mail-api-smoke-dms
    hostname: mail.mail.test
    domainname: mail.test
    ports:
      - "127.0.0.1::993"
      - "127.0.0.1::587"
    environment:
      - OVERRIDE_HOSTNAME=mail.mail.test
      - DMS_SSL=manual
      - SSL_TYPE=manual
      - SSL_CERT_PATH=/tmp/docker-mailserver/certs/cert.pem
      - SSL_KEY_PATH=/tmp/docker-mailserver/certs/key.pem
      - ONE_DIR=1
      - ENABLE_CLAMAV=0
      - ENABLE_SPAMASSASSIN=0
      - ENABLE_FAIL2BAN=0
      - ENABLE_POSTGREY=0
      - ENABLE_RSPAMD=0
      - SPOOF_PROTECTION=1
      - POSTFIX_MESSAGE_SIZE_LIMIT=10485760
    volumes:
      - ./certs:/tmp/docker-mailserver/certs:ro
      - ./config:/tmp/docker-mailserver:rw
      - ./data:/var/mail:rw
      - ./state:/var/mail-state:rw
    restart: "no"
